
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Orchard Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              uom: {
                black: '#000000',
                white: '#ffffff',
                gray: '#1a1a1a',
                lightgray: '#333333',
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Playfair Display', 'serif'],
            },
            animation: {
              'scroll-up': 'scrollUp 40s linear infinite',
              'scroll-down': 'scrollDown 40s linear infinite',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000;
        color: white;
        margin: 0;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        background-color: #000000;
      }
      .font-display {
        font-family: 'Playfair Display', serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Infinite Scroll Keyframes */
      @keyframes scrollUp {
        0% { transform: translateY(0); }
        100% { transform: translateY(-50%); }
      }
      @keyframes scrollDown {
        0% { transform: translateY(-50%); }
        100% { transform: translateY(0); }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* =========================================
         LEGACY EFFECTS (1-42) 
         ========================================= */
      
      /* 1. Pulse Glow */
      @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 5px white; }
        50% { box-shadow: 0 0 20px white; }
      }
      .anim-pulse-glow { animation: pulseGlow 2s infinite; }

      /* 2. Wave Bar */
      @keyframes waveBar {
        0%, 100% { height: 20%; }
        50% { height: 100%; }
      }
      .anim-wave-bar { animation: waveBar 1s ease-in-out infinite; }

      /* 3. Spin Slow */
      @keyframes spinSlow {
        to { transform: rotate(360deg); }
      }
      .anim-spin-slow { animation: spinSlow 8s linear infinite; }

      /* 4. Glitch Effect */
      @keyframes glitchSkew {
        0% { transform: skew(0deg); }
        20% { transform: skew(-10deg); }
        40% { transform: skew(10deg); }
        60% { transform: skew(-5deg); }
        80% { transform: skew(5deg); }
        100% { transform: skew(0deg); }
      }
      .anim-glitch { animation: glitchSkew 0.5s infinite; }

      /* 5. Float */
      @keyframes floatY {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
      .anim-float { animation: floatY 3s ease-in-out infinite; }

      /* 6. Blur In */
      @keyframes blurIn {
        0% { filter: blur(10px); opacity: 0; }
        100% { filter: blur(0); opacity: 1; }
      }
      .anim-blur-in { animation: blurIn 2s infinite alternate; }

      /* 7. Neon Flicker */
      @keyframes neonFlicker {
        0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
        20%, 24%, 55% { opacity: 0.4; }
      }
      .anim-neon { animation: neonFlicker 2s infinite; }

      /* 8. Scale Loop */
      @keyframes scaleLoop {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(0.9); }
      }
      .anim-scale { animation: scaleLoop 1.5s ease-in-out infinite; }

      /* 9. Slide Reveal */
      @keyframes slideReveal {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .anim-slide-mask { position: absolute; inset: 0; background: white; animation: slideReveal 2s infinite; }

      /* 10. Typewriter Cursor */
      @keyframes blinkCursor {
        from, to { border-color: transparent; }
        50% { border-color: white; }
      }
      .anim-typewriter { border-right: 2px solid white; animation: blinkCursor 0.7s step-end infinite; }

      /* 11. Shake */
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .anim-shake { animation: shake 0.5s ease-in-out infinite; }

      /* 12. Rainbow Text */
      @keyframes rainbowFlow {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
      }
      .anim-rainbow-text {
        background: linear-gradient(270deg, #ff0000, #00ff00, #0000ff, #ff0000);
        background-size: 800% 800%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: rainbowFlow 4s ease infinite;
      }

      /* 13. Flip 3D */
      @keyframes flip3d {
        0% { transform: perspective(400px) rotateY(0); }
        100% { transform: perspective(400px) rotateY(360deg); }
      }
      .anim-flip-3d { animation: flip3d 5s linear infinite; }

      /* 14. Bounce */
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      .anim-bounce { animation: bounce 1s ease-in-out infinite; }

      /* 15. Scanline */
      @keyframes scanlineMove {
        0% { top: -100%; }
        100% { top: 100%; }
      }
      .anim-scanline { position: relative; overflow: hidden; }
      .anim-scanline::after {
        content: "";
        position: absolute;
        top: -100%;
        left: 0;
        width: 100%;
        height: 50%;
        background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.5), transparent);
        animation: scanlineMove 3s linear infinite;
      }

      /* 16. Text Glow Cycle */
      @keyframes glowCycle {
        0% { text-shadow: 0 0 5px #fff; }
        50% { text-shadow: 0 0 20px #ff00de, 0 0 30px #ff00de; }
        100% { text-shadow: 0 0 5px #fff; }
      }
      .anim-glow-cycle { animation: glowCycle 2s infinite; }

      /* 17. Fade Cycle */
      @keyframes fadeCycle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .anim-fade-cycle { animation: fadeCycle 3s infinite; }

      /* 18. Hue Rotate */
      @keyframes hueRotate {
        0% { filter: hue-rotate(0deg); }
        100% { filter: hue-rotate(360deg); }
      }
      .anim-hue-cycle { animation: hueRotate 5s linear infinite; }

      /* 19. Wobble */
      @keyframes wobble {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-5deg); }
        75% { transform: rotate(5deg); }
      }
      .anim-wobble { animation: wobble 1s ease-in-out infinite; }

      /* 20. Tracking Expand */
      @keyframes trackingExpand {
        0%, 100% { letter-spacing: normal; }
        50% { letter-spacing: 0.5em; }
      }
      .anim-tracking-expand { animation: trackingExpand 4s ease-in-out infinite; }

      /* 21. Strobe */
      @keyframes strobe {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .anim-strobe { animation: strobe 0.2s steps(1) infinite; }

      /* 22. VHS Color Shift */
      @keyframes vhsShift {
        0% { text-shadow: -2px 0 red, 2px 0 blue; }
        50% { text-shadow: -4px 0 red, 4px 0 blue; }
        100% { text-shadow: -2px 0 red, 2px 0 blue; }
      }
      .anim-vhs { animation: vhsShift 0.2s infinite; }

      /* 23. Liquid */
      @keyframes liquid {
        0% { border-radius: 0; }
        50% { border-radius: 50%; }
        100% { border-radius: 0; }
      }
      .anim-liquid { animation: liquid 3s ease-in-out infinite; border: 2px solid white; padding: 5px; }

      /* 24. Ghost */
      @keyframes ghostFloat {
        0% { opacity: 0.5; transform: translate(0, 0); }
        50% { opacity: 0.2; transform: translate(-10px, -10px); }
        100% { opacity: 0.5; transform: translate(0, 0); }
      }
      .anim-ghost { position: relative; }

      /* 25. Invert */
      @keyframes invertCycle {
        0%, 100% { filter: invert(0); }
        50% { filter: invert(1); }
      }
      .anim-invert { animation: invertCycle 1s steps(2) infinite; }

      /* 26. Squeeze */
      @keyframes squeeze {
        0%, 100% { transform: scaleX(1); }
        50% { transform: scaleX(0.5); }
      }
      .anim-squeeze { animation: squeeze 1s ease-in-out infinite; }

      /* 27. Stretch */
      @keyframes stretch {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(2); }
      }
      .anim-stretch { animation: stretch 1s ease-in-out infinite; }

      /* 28. Swing */
      @keyframes swing {
        0% { transform: rotate(10deg); }
        100% { transform: rotate(-10deg); }
      }
      .anim-swing { animation: swing 1s ease-in-out infinite alternate; }

      /* 29. Heartbeat */
      @keyframes heartbeat {
        0% { transform: scale(1); }
        25% { transform: scale(1.1); }
        40% { transform: scale(1); }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
      .anim-heartbeat { animation: heartbeat 1s infinite; }

      /* 30. Spotlight */
      @keyframes spotlightMove {
        0% { clip-path: circle(20% at 0% 50%); }
        100% { clip-path: circle(20% at 100% 50%); }
      }
      .anim-spotlight { animation: spotlightMove 3s linear infinite; }

      /* 31. Skew Alt */
      @keyframes skewAlt {
        0% { transform: skewX(20deg); }
        100% { transform: skewX(-20deg); }
      }
      .anim-skew-alt { animation: skewAlt 0.5s infinite alternate; }

      /* 32. Jiggle */
      @keyframes jiggle {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        25% { transform: translate(-1px, -2px) rotate(-1deg); }
        50% { transform: translate(-3px, 0px) rotate(1deg); }
        75% { transform: translate(3px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -1px) rotate(1deg); }
      }
      .anim-jiggle { animation: jiggle 0.3s infinite; }

      /* 33. Fade Up */
      @keyframes fadeUpLoop {
        0% { opacity: 0; transform: translateY(20px); }
        50% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-20px); }
      }
      .anim-fade-up { animation: fadeUpLoop 2s infinite; }

      /* 34. Blink Fast */
      @keyframes blinkFast {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      .anim-blink-fast { animation: blinkFast 0.1s infinite; }

      /* 35. Flip X */
      @keyframes flipX {
        0% { transform: rotateX(0deg); }
        100% { transform: rotateX(180deg); }
      }
      .anim-flip-x { animation: flipX 2s infinite; }

      /* 36. Border Flash */
      @keyframes borderFlash {
        0% { border-color: red; }
        33% { border-color: green; }
        66% { border-color: blue; }
        100% { border-color: red; }
      }
      .anim-border-flash { border: 4px solid red; animation: borderFlash 0.5s infinite; }

      /* 37. Shadow Drift */
      @keyframes shadowDrift {
        0% { text-shadow: 0 0 0 white; }
        100% { text-shadow: 20px 20px 0px rgba(255,255,255,0.5); }
      }
      .anim-shadow-drift { animation: shadowDrift 2s infinite alternate; }

      /* 38. CRT Curve */
      @keyframes crtCurve {
        0% { transform: perspective(100px) rotateX(2deg); }
        50% { transform: perspective(100px) rotateX(-2deg); }
        100% { transform: perspective(100px) rotateX(2deg); }
      }
      .anim-crt { animation: crtCurve 4s infinite; }

      /* 39. Sepia Cycle */
      @keyframes sepiaCycle {
        0% { filter: sepia(0); }
        50% { filter: sepia(1); }
        100% { filter: sepia(0); }
      }
      .anim-sepia { animation: sepiaCycle 2s infinite; }

      /* 40. Mirror */
      @keyframes mirrorFlip {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(-1); }
      }
      .anim-mirror { animation: mirrorFlip 3s infinite; }

      /* 41. Cyber Glitch */
      @keyframes cyberGlitch {
        0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); transform: translate(0,0); }
        20% { clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%); transform: translate(-5px,5px); }
        40% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); transform: translate(-5px,-5px); }
        60% { clip-path: polygon(0 1%, 100% 1%, 100% 2%, 0 2%); transform: translate(5px,5px); }
        80% { clip-path: polygon(0 50%, 100% 50%, 100% 20%, 0 20%); transform: translate(5px,-5px); }
        100% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); transform: translate(0,0); }
      }
      .anim-cyber-glitch { animation: cyberGlitch 0.5s infinite linear alternate-reverse; }

      /* 42. Liquid Metal */
      @keyframes liquidMetal {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .anim-liquid-metal {
        background: linear-gradient(45deg, #ffffff, #666666, #ffffff);
        background-size: 200% 200%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: liquidMetal 3s ease infinite;
      }

      /* =========================================
         NEW TITLE EFFECTS (10)
         ========================================= */

      /* T1. Cinema Tracking */
      .anim-title-cinema { animation: tracking-in-expand 2s cubic-bezier(0.215, 0.610, 0.355, 1.000) both infinite alternate; }
      @keyframes tracking-in-expand { 0% { letter-spacing: -0.5em; opacity: 0; } 40% { opacity: 0.6; } 100% { opacity: 1; } }

      /* T2. Shudder */
      .anim-title-shudder { animation: shudder 0.5s linear infinite; }
      @keyframes shudder { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(2px); } 75% { transform: translateX(-2px); } }

      /* T3. Gradient Flow */
      .anim-title-gradient-flow { background: linear-gradient(to right, #fff, #666, #fff); background-size: 200% auto; -webkit-background-clip: text; color: transparent; animation: gradientFlow 3s linear infinite; }
      @keyframes gradientFlow { to { background-position: 200% center; } }

      /* T4. 3D Pop */
      .anim-title-3d-pop { animation: text-pop-up-top 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) infinite alternate; }
      @keyframes text-pop-up-top { 0% { transform: translateY(0); text-shadow: none; } 100% { transform: translateY(-10px); text-shadow: 0 1px 0 #ccc, 0 2px 0 #ccc, 0 3px 0 #ccc, 0 4px 0 #ccc, 0 5px 0 #ccc; } }

      /* T5. Blur Out */
      .anim-title-blur-out { animation: blur-out 2s infinite alternate; }
      @keyframes blur-out { 0% { filter: blur(0); } 100% { filter: blur(4px); } }

      /* T6. Squeeze Title */
      .anim-title-squeeze { animation: squeeze-title 1s infinite; }
      @keyframes squeeze-title { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.8); } }

      /* T7. Swing Title */
      .anim-title-swing { transform-origin: top center; animation: swing-title 2s ease-in-out infinite; }
      @keyframes swing-title { 0% { transform: rotate(5deg); } 50% { transform: rotate(-5deg); } 100% { transform: rotate(5deg); } }

      /* T8. Elevator */
      .anim-title-elevator { animation: elevator 3s ease-in-out infinite; }
      @keyframes elevator { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

      /* T9. Color Cycle */
      .anim-title-color-cycle { animation: color-cycle 5s infinite; }
      @keyframes color-cycle { 0% { color: #fff; } 33% { color: #ff00ff; } 66% { color: #00ffff; } 100% { color: #fff; } }

      /* T10. Mask Reveal */
      .anim-title-mask-reveal { animation: mask-reveal 3s infinite; }
      @keyframes mask-reveal { 0% { clip-path: inset(0 100% 0 0); } 50% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 0 0 100%); } }


      /* =========================================
         NEW WALL PHOTO EFFECTS (20)
         ========================================= */

      /* W1. Breathing Wall */
      .anim-wall-breathing { animation: breathing 4s ease-in-out infinite; }
      @keyframes breathing { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

      /* W2. Ken Burns */
      .anim-wall-kenburns { animation: kenburns 10s ease-in-out infinite alternate; }
      @keyframes kenburns { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.2) translate(-2%, -2%); } }

      /* W3. Float Wall */
      .anim-wall-float { animation: float-wall 3s ease-in-out infinite; }
      @keyframes float-wall { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

      /* W4. Cyber Glitch Wall */
      .anim-wall-cyber-glitch { animation: cyber-glitch-wall 2s infinite; }
      @keyframes cyber-glitch-wall { 0% { clip-path: inset(0 0 0 0); } 5% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 2px); } 10% { clip-path: inset(0 0 0 0); transform: translate(0); } }

      /* W5. Sepia Dream */
      .anim-wall-sepia-dream { animation: sepia-dream 4s infinite alternate; }
      @keyframes sepia-dream { 0% { filter: sepia(0) contrast(1); } 100% { filter: sepia(1) contrast(1.2); } }

      /* W6. Neon Border */
      .anim-wall-neon-border { animation: neon-border 2s infinite; border: 2px solid transparent; }
      @keyframes neon-border { 0% { border-color: #ff00ff; box-shadow: 0 0 5px #ff00ff; } 50% { border-color: #00ffff; box-shadow: 0 0 15px #00ffff; } 100% { border-color: #ff00ff; box-shadow: 0 0 5px #ff00ff; } }

      /* W7. Spin Slow Wall */
      .anim-wall-spin-slow { animation: spin-slow-wall 10s linear infinite; }
      @keyframes spin-slow-wall { 100% { transform: rotate(360deg); } }

      /* W8. Perspective Left */
      .anim-wall-perspective-left { animation: persp-left 2s infinite alternate; }
      @keyframes persp-left { from { transform: perspective(500px) rotateY(0deg); } to { transform: perspective(500px) rotateY(15deg); } }

      /* W9. Perspective Right */
      .anim-wall-perspective-right { animation: persp-right 2s infinite alternate; }
      @keyframes persp-right { from { transform: perspective(500px) rotateY(0deg); } to { transform: perspective(500px) rotateY(-15deg); } }

      /* W10. Pulse Shock */
      .anim-wall-pulse-shock { animation: pulse-shock 1s infinite; }
      @keyframes pulse-shock { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); } 70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }

      /* W11. B&W Flash */
      .anim-wall-bw-flash { animation: bw-flash 0.5s infinite; }
      @keyframes bw-flash { 0%, 100% { filter: grayscale(1); } 50% { filter: grayscale(0); } }

      /* W12. Hue Trip */
      .anim-wall-hue-trip { animation: hue-trip 3s linear infinite; }
      @keyframes hue-trip { 100% { filter: hue-rotate(360deg); } }

      /* W13. Mirror Y */
      .anim-wall-mirror-y { transform: scaleY(-1); }

      /* W14. Shake Hard */
      .anim-wall-shake-hard { animation: shake-hard 0.2s infinite; }
      @keyframes shake-hard { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -2px); } }

      /* W15. Lens Flare Sim */
      .anim-wall-lens-flare { position: relative; overflow: hidden; }
      .anim-wall-lens-flare::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(to bottom right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%); transform: rotate(45deg); animation: lens-flare 3s infinite; }
      @keyframes lens-flare { 0% { transform: rotate(45deg) translateY(-100%); } 100% { transform: rotate(45deg) translateY(100%); } }

      /* W16. Wobble Skew */
      .anim-wall-wobble-skew { animation: wobble-skew 2s infinite; }
      @keyframes wobble-skew { 0%, 100% { transform: skew(0); } 25% { transform: skew(5deg); } 75% { transform: skew(-5deg); } }

      /* W17. Heartbeat Wall */
      .anim-wall-heartbeat { animation: heartbeat-wall 1.5s ease-in-out infinite; }
      @keyframes heartbeat-wall { 0% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } 100% { transform: scale(1); } }

      /* W18. CRT Flicker */
      .anim-wall-crt-flicker { animation: crt-flicker-wall 0.1s infinite; opacity: 0.9; }
      @keyframes crt-flicker-wall { 0% { opacity: 0.9; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

      /* W19. Liquid Morph */
      .anim-wall-liquid-morph { animation: liquid-morph-wall 4s infinite; border: 2px solid white; }
      @keyframes liquid-morph-wall { 0% { border-radius: 0; } 25% { border-radius: 50% 0 0 0; } 50% { border-radius: 50%; } 75% { border-radius: 0 50% 0 50%; } 100% { border-radius: 0; } }

      /* W20. Slide Glitch */
      .anim-wall-slide-glitch { animation: slide-glitch 1s infinite steps(2); }
      @keyframes slide-glitch { 0% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-2px); } 100% { transform: translateX(0); } }

      /* W21. Rotate 3D */
      .anim-wall-rotate-3d { animation: rotate-3d-wall 5s linear infinite; }
      @keyframes rotate-3d-wall { 0% { transform: rotateY(0); } 100% { transform: rotateY(360deg); } }

    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",

  <body>
    <div id="root"></div>
